name: Deploy to GitHub Pages

# Publishes the site to the gh-pages branch; GitHub Pages serves it from there.
on:
  push:
    branches: [ccr-b2cc99aa-2fm71u]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/photos
          cp index.html _site/
          cp photos/*.jpg _site/photos/
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy site"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
